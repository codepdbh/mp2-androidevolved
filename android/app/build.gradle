plugins { id 'com.android.application' }
def experimentalArm32 = providers.gradleProperty('experimentalArm32').orNull == 'true'
android {
    namespace 'com.mp2r.android'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.mp2r.android'
        minSdk 29
        targetSdk 35
        versionCode 21
        versionName experimentalArm32 ? '0.21-pc-arm32-experimental' : '0.21-pc'
        ndk { abiFilters experimentalArm32 ? 'armeabi-v7a' : 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; targets 'mp2_android' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
