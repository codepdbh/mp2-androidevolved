[desktop]
windowed_only = true
fullscreen_allowed = false
maximize_on_start = false
always_on_top = false
width = 960
height = 540
vsync = true
fps_limit = 45
capture_mouse_on_start = false
prefer_headless_tests = true

[analysis]
jobs = 2
memory_limit_mb = 2048
timeout_seconds = 300

# Whole-program recompilation and compilation of ~16k translation units.
# Only used when a caller passes --profile build explicitly.
[build]
jobs = 6
memory_limit_mb = 6144
timeout_seconds = 7200
